name: Sync Playlist Registry

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout player-ui
        uses: actions/checkout@v4

      - name: Fetch and Overwrite playlist.json
        run: |
          curl -o playlist.json https://media.alexgaming.dev/playlist.json

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.json
          git commit -m "Auto-sync registry: $(date)" || echo "No changes to commit"
          git push
