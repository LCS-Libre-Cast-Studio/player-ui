name: Sync Playlist Registry

on:
  schedule:
    - cron: '00 00 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout player-ui
        uses: actions/checkout@v4

      - name: Fetch and Overwrite playlist.json
        run: |
          curl -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
               -L -f -o playlist.json https://media.alexgaming.dev/playlist.json

      - name: Commit and Push
        run: |
          git config user.name "Libre Cast Studio [BOT]"
          git config user.email "alexander.dennhoven@alexgaming.is-a.dev"
          if [[ -n $(git status --porcelain playlist.json) ]]; then
            git add playlist.json
            git commit -m "Auto-sync registry: $(date)"
            git push
          else
            echo "Keine Änderungen erkannt."
          fi
